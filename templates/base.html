<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#303b67">
    <meta name="description" content="本地运行的四六级学习助手：单词、复习、阅读、听力、语法、写作与段位分析。">
    <title>{% block title %}四六级学习台{% endblock %}</title>
    <link rel="stylesheet" href="{{ asset('css/style.css') }}">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23303b67'/%3E%3Ctext x='32' y='39' text-anchor='middle' font-family='serif' font-size='22' fill='white'%3ECET%3C/text%3E%3C/svg%3E">
    <script src="{{ asset('vendor/echarts.min.js') }}"></script>
    <script defer src="{{ asset('vendor/alpine.min.js') }}"></script>
</head>
<body data-page="{{ request.endpoint }}">
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <header class="site-header">
        <div class="site-header__inner">
            <a class="brand" href="/" aria-label="四六级学习台首页">
                <span class="brand__mark" aria-hidden="true">CET</span>
                <span class="brand__copy"><strong>四六级学习台</strong><small>每天看得见的进步</small></span>
            </a>
            <nav class="desktop-nav" aria-label="主导航">
                <a class="nav-link" href="/" data-nav="home">首页</a>
                <a class="nav-link" href="/learn" data-nav="learn">学习</a>
                <a class="nav-link" href="/control" data-nav="control">控制</a>
                <a class="nav-link" href="/growth" data-nav="growth">段位</a>
                <a class="nav-link" href="/profile" data-nav="profile">我的</a>
            </nav>
            <a class="header-status" href="/review">
                <span class="status-dot" aria-hidden="true"></span>
                <span>今日复习</span>
            </a>
        </div>
    </header>

    <main id="main-content" class="site-main" tabindex="-1">
        {% block content %}{% endblock %}
    </main>

    <nav class="mobile-nav" aria-label="手机主导航">
        <a href="/" class="mobile-nav__item" data-nav="home"><span aria-hidden="true">首</span><b>首页</b></a>
        <a href="/learn" class="mobile-nav__item" data-nav="learn"><span aria-hidden="true">学</span><b>学习</b></a>
        <a href="/control" class="mobile-nav__item" data-nav="control"><span aria-hidden="true">控</span><b>控制</b></a>
        <a href="/growth" class="mobile-nav__item" data-nav="growth"><span aria-hidden="true">段</span><b>段位</b></a>
        <a href="/profile" class="mobile-nav__item" data-nav="profile"><span aria-hidden="true">我</span><b>我的</b></a>
    </nav>

    <div id="toast-container" class="toast-stack" aria-live="polite" aria-atomic="true"></div>
    <script src="{{ asset('js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
