name: stable-release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Verify tag and version contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/check_app_version.py
          if ($LASTEXITCODE -ne 0) { throw "Version contract check failed" }
          $version = python -c "from app_version import APP_VERSION; print(APP_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw "Unable to read application version" }
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match v$version" }
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem static/js -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  windows:
    needs: test
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Fetch verified offline pronunciation pack
        run: python scripts/fetch_pronunciation_pack.py
      - name: Build signed Windows updater
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "Missing TAURI_SIGNING_PRIVATE_KEY secret" }
          $keyFile = Join-Path $env:RUNNER_TEMP "tauri-updater.key"
          [IO.File]::WriteAllText($keyFile, $env:TAURI_SIGNING_PRIVATE_KEY, [Text.UTF8Encoding]::new($false))
          $env:TAURI_SIGNING_PRIVATE_KEY_PATH = $keyFile
          Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY
          $python = (Get-Command python).Source
          powershell -ExecutionPolicy Bypass -File .\desktop\build_windows.ps1 -Python $python
      - name: Stage Windows artifacts
        shell: pwsh
        run: |
          $version = python -c "from app_version import APP_VERSION; print(APP_VERSION)"
          $bundle = Join-Path $PWD "desktop\src-tauri\target\release\bundle\nsis"
          $installer = Get-ChildItem -LiteralPath $bundle -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $signature = Get-Item -LiteralPath ($installer.FullName + ".sig")
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination "dist\CETLearningDesk-Windows-x64-v$version-setup.exe"
          Copy-Item -LiteralPath $signature.FullName -Destination "dist\CETLearningDesk-Windows-x64-v$version-setup.exe.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error

  android:
    needs: test
    runs-on: windows-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install Android SDK 36
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" "platforms;android-36" "build-tools;36.0.0"
      - name: Fetch verified offline pronunciation pack
        run: python scripts/fetch_pronunciation_pack.py
      - name: Prepare Android resources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:CET_BUILD_PYTHON = (Get-Command python).Source
          python android/prepare_android.py
          if ($LASTEXITCODE -ne 0) { throw "Android resource preparation failed" }
          Push-Location android
          try {
            gradle --no-daemon :app:assembleRelease
            if ($LASTEXITCODE -ne 0) { throw "Android Gradle build failed" }
          } finally {
            Pop-Location
          }
          $unsigned = Join-Path $PWD "android\app\build\outputs\apk\release\app-release-unsigned.apk"
          $version = python -c "from app_version import APP_VERSION; print(APP_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw "Unable to read application version" }
          python scripts/verify_android_apk.py `
            --apk $unsigned `
            --seed resources/distribution/vocab.seed.db `
            --pronunciation-pack resources/pronunciation/pronunciation-pack-v1.zip `
            --version $version
          if ($LASTEXITCODE -ne 0) { throw "Android APK offline runtime verification failed" }
      - name: Sign and verify Android APK
        shell: pwsh
        run: |
          if (-not $env:ANDROID_KEYSTORE_BASE64 -or -not $env:ANDROID_KEYSTORE_PASSWORD) { throw "Missing Android signing secrets" }
          $keyStore = Join-Path $env:RUNNER_TEMP "android-release.jks"
          [IO.File]::WriteAllBytes($keyStore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          $tools = Join-Path $env:ANDROID_HOME "build-tools\36.0.0"
          $unsigned = Join-Path $PWD "android\app\build\outputs\apk\release\app-release-unsigned.apk"
          $aligned = Join-Path $env:RUNNER_TEMP "aligned.apk"
          $version = python -c "from app_version import APP_VERSION; print(APP_VERSION)"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $signed = Join-Path $PWD "dist\CETLearningDesk-Android-arm64-v$version.apk"
          & "$tools\zipalign.exe" -p -f 4 $unsigned $aligned
          if ($LASTEXITCODE -ne 0) { throw "zipalign failed" }
          $env:CET_ANDROID_SIGNING_PASSWORD = $env:ANDROID_KEYSTORE_PASSWORD
          $alias = if ($env:ANDROID_KEY_ALIAS) { $env:ANDROID_KEY_ALIAS } else { "cet-learning-desk" }
          & "$tools\apksigner.bat" sign --ks $keyStore --ks-key-alias $alias --ks-pass env:CET_ANDROID_SIGNING_PASSWORD --key-pass env:CET_ANDROID_SIGNING_PASSWORD --out $signed $aligned
          if ($LASTEXITCODE -ne 0) { throw "APK signing failed" }
          & "$tools\apksigner.bat" verify --verbose --print-certs $signed
          if ($LASTEXITCODE -ne 0) { throw "APK verification failed" }
          Remove-Item Env:CET_ANDROID_SIGNING_PASSWORD -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Build fixed updater manifests
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          android_version_code="$(python -c 'from app_version import ANDROID_VERSION_CODE; print(ANDROID_VERSION_CODE)')"
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes_file"
          windows="dist/CETLearningDesk-Windows-x64-v${version}-setup.exe"
          signature="${windows}.sig"
          android="dist/CETLearningDesk-Android-arm64-v${version}.apk"
          python scripts/create_release_manifests.py \
            --version "$version" \
            --android-version-code "$android_version_code" \
            --windows "$windows" \
            --windows-signature "$signature" \
            --android "$android" \
            --notes-file "$notes_file" \
            --output dist
      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes_file"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "Prerelease tags are not allowed in the stable channel" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-file "$notes_file" --title "四六级学习台 $GITHUB_REF_NAME"
          fi
