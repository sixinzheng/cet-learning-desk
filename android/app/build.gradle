plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'cn.cet.learningdesk'
    compileSdk 36

    defaultConfig {
        applicationId 'cn.cet.learningdesk'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.12'
        buildPython('C:/Users/Lenovo/.cache/codex-runtimes/codex-primary-runtime/dependencies/python/python.exe')
        pip {
            install 'flask==3.1.0'
            install 'requests==2.34.2'
        }
        pyc {
            src = true
            pip = true
        }
    }
}
