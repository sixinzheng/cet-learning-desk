plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'cn.cet.learningdesk'
    compileSdk 36

    defaultConfig {
        applicationId 'cn.cet.learningdesk'
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName '0.3.5'
        testInstrumentationRunner 'cn.cet.learningdesk.UpgradeProbeInstrumentation'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testBuildType 'release'

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}

chaquopy {
    defaultConfig {
        version = '3.12'
        buildPython(System.getenv('CET_BUILD_PYTHON') ?: 'C:/Users/Lenovo/.cache/codex-runtimes/codex-primary-runtime/dependencies/python/python.exe')
        pip {
            install 'flask==3.1.0'
            install 'requests==2.34.2'
        }
        pyc {
            src = true
            pip = true
        }
    }
}
